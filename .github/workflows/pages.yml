# Publishes the setup guide (site/) to https://inspace9018.github.io/fusion-to-blender-bridge/
#
# The site lives in site/, not docs/: docs/ is kept out of git on purpose (it
# holds local operational notes), so GitHub Pages' "deploy from /docs" mode
# cannot be used here. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/demo.gif"
      - "demo.gif"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp docs/demo.gif _site/demo.gif
          cp demo.gif _site/pro-demo.gif
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
